# Deploys the statically-exported Next.js site to GitHub Pages.
#
# Setup (one time, on github.com):
#   1. Push this repo to GitHub.
#   2. Go to Settings → Pages → "Build and deployment" → Source: "GitHub Actions".
#   3. (Optional) set NEXT_PUBLIC_SITE_URL in Settings → Secrets → Actions
#      as a repository secret, so RSS/OpenGraph URLs use your real domain.
#      Example value: https://yourname.github.io/blog
#
# After that, every push to main redeploys the site automatically.
#
# NOTE on URLs: this deploys the site at the domain ROOT
# (yourname.github.io or a custom domain). If you instead want it under a
# project sub-path (yourname.github.io/blog), add to next.config.ts:
#   basePath: "/blog",
# and prefix image paths in markdown accordingly.

name: Deploy to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
